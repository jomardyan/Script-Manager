name: Build and Test

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          # Vite 7 requires ^20.19 || >=22.12; the previous "18" here could
          # never install, so this job failed on every run.
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci
        working-directory: frontend

      - name: Build
        run: npm run build
        working-directory: frontend

  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: python -m pip install -r requirements-dev.txt
        working-directory: backend

      - name: Syntax check
        run: python -m compileall -q app main.py
        working-directory: backend

      - name: Run tests
        # Run from backend/ so pytest.ini (asyncio_mode = auto) and the
        # package layout resolve the same way they do locally.
        run: python -m pytest -q
        working-directory: backend
        env:
          # The scheduler would otherwise start background subprocesses during
          # the run; conftest sets this too, belt and braces.
          ENABLE_SCHEDULER: "false"
