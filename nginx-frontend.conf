server {
    listen 3000;
    server_name localhost;

    root /usr/share/nginx/html;
    index index.html;

    # Uploaded attachments and imported metadata can be large.
    client_max_body_size 100M;

    resolver 127.0.0.11 valid=10s ipv6=off;

    # The SPA calls the API on the same origin ("/api/..."), so this container
    # has to forward those requests to the backend. Without this block every
    # API call fell through to the catch-all below and was answered with
    # index.html, which broke the whole application whenever it was run from
    # docker-compose without the optional reverse proxy in front.
    location /api/ {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_send_timeout 300s;
        proxy_read_timeout 300s;
    }

    # Backend liveness, proxied so an operator can probe a single origin.
    location = /api-health {
        set $backend_upstream backend:8000;
        proxy_pass http://$backend_upstream/health;
        access_log off;
    }

    # Container liveness for the Docker healthcheck.
    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Hashed asset filenames are immutable, so they can be cached hard.
    location ~ ^/assets/ {
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # React routing - all remaining routes serve index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # Redirect /index.html to /
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }
}
